---
# yamllint disable rule:line-length
name: CI Pipeline

on:  # yamllint disable-line rule:truthy
  push:

env:
  INTER_VERSION: "4.1"

jobs:
  build_font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run flake8
        run: flake8
      - name: Get Interaki version
        run: echo "INTERAKI_VERSION=$(python interaki.py --version)" >> "$GITHUB_ENV"
      - name: Download Inter
        run: |
          curl -fsSL -o inter.zip \
            "https://github.com/rsms/inter/releases/download/v$INTER_VERSION/Inter-$INTER_VERSION.zip"
      - name: Unzip Inter
        run: unzip -q inter.zip -d inter
      - name: Build Interaki
        run: python interaki.py inter --extras -o dist
      - name: Copy license file
        run: cp LICENSE.md dist/
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Interaki-${{ env.INTERAKI_VERSION }}
          path: dist/
          if-no-files-found: error
  publish_release:
    if: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref, '.') }}
    needs:
      - build_font
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release zip
        run: zip -r Interaki-${{ github.ref_name }}.zip .
      - name: Create github release
        uses: softprops/action-gh-release@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.zip
